<script>
"use strict";
/* ──────────────────────────────────────────────────────────────────────
   Cadence & Case — the admin page for this repository.

   This repo is not a platform repo. It holds LinkedIn articles, carousel
   builders, a resume, and three agents: a LinkedIn growth strategist, an
   Instagram strategist for @microlearn.withme, and an EB1A advisor. Read
   them together and they state one thesis outright — the Instagram agent's
   mandate is "(1) grow the account organically and (2) produce a dated,
   public archive of original educational work that functions as EB1A
   petition evidence."

   So the publishing pipeline and the petition are the same pipeline seen
   twice. This page operates both faces of it at once: every artifact
   carries what it did for REACH and what it is worth as CASE evidence,
   and the ledger totals the second while the calendar drives the first.

   The gate is the weave platform's, unchanged: consequential actions are
   proposed, scored against the six-signal risk vector, and committed
   separately. It carries a rule that turns out to be the same rule the
   petition runs on — an action cleared on fewer than three signals is
   held for review however low it scores, because a low composite from one
   signal is not the evidence a low composite from six is. A criterion
   "met" on one thin document does not stand up to an adjudicator reading
   the file cold either. Same standard, twice.

   DATA. window.WEAVE_CONFIG present → live, fetched from the deployed
   stacks. Absent → example data, labelled in the header and never passed
   off as real figures.
   ────────────────────────────────────────────────────────────────────── */

const CFG = window.WEAVE_CONFIG || null;
const LIVE = !!(CFG && CFG.services);

/* The regulatory criteria, 8 CFR 204.5(h)(3). Three of ten are required,
   and then the whole file has to survive a final-merits determination —
   which is why "3 met" is a floor and not an answer. */
const CRITERIA = [
  {n:1, name:"Awards", full:"Lesser nationally or internationally recognised prizes for excellence"},
  {n:2, name:"Membership", full:"Membership in associations requiring outstanding achievement"},
  {n:3, name:"Published material about him", full:"In professional or major trade publications, or other major media"},
  {n:4, name:"Judging others' work", full:"Participation as a judge of the work of others in the field"},
  {n:5, name:"Original contributions", full:"Original contributions of major significance to the field"},
  {n:6, name:"Authorship", full:"Authorship of scholarly articles in professional or major trade publications"},
  {n:7, name:"Artistic display", full:"Display of work at artistic exhibitions or showcases"},
  {n:8, name:"Critical role", full:"Leading or critical role for distinguished organisations"},
  {n:9, name:"High remuneration", full:"High salary or remuneration relative to the field"},
  {n:10,name:"Commercial success", full:"Commercial success in the performing arts"}
];

/* Example figures. Example — see the header chip. */
const DEMO = {
  dayZero:"2026-11-14",           // the 60-day window the EB1A agent works to
  evidence:{ 4:2, 5:3, 6:4, 8:2, 9:1, 2:0, 1:0, 3:1, 7:0, 10:0 },
  notes:{
    4:"Two review invitations, both accepted; no completed review on file yet.",
    5:"Three systems in production with documented adoption outside the team.",
    6:"Four long-form technical articles; two carry citations from outside the org.",
    8:"Senior lead on two named platforms; org-chart letter not yet requested.",
    9:"One compensation letter; no field benchmark attached.",
    3:"One mention; not independent coverage."
  },
  week:[
    {d:"Mon", ch:"LinkedIn",  title:"Why a shared table is not a shared contract", state:"published", crit:6},
    {d:"Tue", ch:"Instagram", title:"Context engineering in 60 seconds", state:"published", crit:3},
    {d:"Wed", ch:"LinkedIn",  title:"Propose, then commit", state:"drafted", crit:6},
    {d:"Thu", ch:null},
    {d:"Fri", ch:"LinkedIn",  title:null, state:"slot", crit:6},
    {d:"Sat", ch:"Instagram", title:null, state:"slot", crit:3},
    {d:"Sun", ch:null}
  ],
  reach:[
    {ch:"LinkedIn posts", n:3, imp:14820, c:"--reach"},
    {ch:"Instagram reels", n:2, imp:5310, c:"--case"}
  ],
  spend:[
    {op:"draft with strategist", usd:6.20, calls:41},
    {op:"ask the corpus", usd:2.85, calls:96},
    {op:"carousel render", usd:0.42, calls:6}
  ],
  decisions:{ALLOW:118, REVIEW:14, BLOCK:2},
  answer:{
    answer:"The corpus this console queries is the markdown in this repository. The deploy workflow syncs every .md file to the ContextWeave artifacts bucket on each push to main, so the articles, the resume and the LinkedIn drafts are all retrievable — and nothing else in the repo is, because the sync filters on *.md.",
    sources:[
      {file:".github/workflows/deploy.yaml", excerpt:"aws s3 sync . --include \"*.md\"", weight:1.0},
      {file:"linkedin_article_context_engineering.md", excerpt:"context engineering as an architectural discipline", weight:0.6},
      {file:"TARUN_RAJA_RESUME.md", excerpt:"self-reported, not independently verified", weight:0.3}
    ],
    confidence:.81, confidenceReported:true, questionType:"project", strategy:"keyword_boosted", propensity:.28
  }
};

const AGENTS = {
  "linkedin-growth-strategist":{
    label:"LinkedIn strategist",
    blurb:"3× a week, locked content lane, hook / proof / question.",
    crit:6, channel:"LinkedIn"
  },
  "instagram-growth-strategist":{
    label:"Instagram strategist",
    blurb:"@microlearn.withme — micro-lessons that double as a dated public archive.",
    crit:3, channel:"Instagram"
  },
  "eb1a-advisor":{
    label:"EB1A advisor",
    blurb:"Reads the file cold, like an adjudicator. Candid about gaps.",
    crit:null, channel:null
  }
};

/* ── the gate (the platform's, unchanged) ───────────────────────────── */
const SIGNALS = ["grounding_risk","self_consistency_risk","numeric_instability_risk",
                 "tool_mismatch_risk","drift_risk","verifier_risk"];
const hash = s => {let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0)/4294967296};

function score(kind, subject){
  const defines = {
    publish:["grounding_risk","self_consistency_risk","verifier_risk","drift_risk"],
    draft:["grounding_risk","self_consistency_risk","numeric_instability_risk",
           "tool_mismatch_risk","drift_risk","verifier_risk"],
    evidence:["grounding_risk","verifier_risk"],
    ask:["verifier_risk"]
  }[kind] || ["verifier_risk"];
  const v={}; const seed=kind+"|"+subject;
  SIGNALS.forEach((s,i)=>{ v[s]=defines.includes(s)?+(hash(seed+s+i)*0.6).toFixed(3):null });
  const on=SIGNALS.filter(s=>v[s]!==null);
  const composite=+(on.reduce((a,s)=>a+v[s],0)/on.length).toFixed(3);
  const level=composite>=.55?"high":composite>=.25?"medium":"low";
  const thin=on.length<3 && kind!=="ask";
  const decision = level==="high" ? "BLOCK" : (level==="medium"||thin) ? "REVIEW" : "ALLOW";
  return {v, on:on.length, composite, level, decision, thin};
}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=n=>n.toLocaleString();
const usd=n=>"$"+n.toFixed(2);
const pct=n=>Math.round(n*100)+"%";
const daysLeft=()=>Math.max(0,Math.ceil((new Date(DEMO.dayZero)-new Date())/864e5));
</script>
<script>
"use strict";
const PROBLEMS=[
  {id:"week",  t:"Hit this week's cadence", d:"Three LinkedIn, two Instagram — what's missing"},
  {id:"draft", t:"Draft with a strategist", d:"Give a topic, get a post through the gate"},
  {id:"case",  t:"Build the EB1A case",     d:"Criteria ledger and where it is thin"},
  {id:"ask",   t:"Ask my own corpus",       d:"Query the markdown this repo syncs"},
  {id:"cost",  t:"See what it cost",        d:"Model spend and what the gate refused"}
];
let current="week", staged=null;
const state={week:DEMO.week.map(d=>({...d})), evidence:{...DEMO.evidence},
             draft:null, answer:null};

/* ── gate strip ─────────────────────────────────────────────────────── */
const gate=document.getElementById("gate");
function stage(p){
  staged=p; const s=p.score;
  gate.classList.remove("idle");
  document.getElementById("threads").innerHTML=SIGNALS.map(n=>{
    const v=s.v[n];
    if(v===null) return `<div class="thr undef" style="height:40px" title="${n}: not measured for this action"></div>`;
    return `<div class="thr" style="height:${Math.max(7,Math.round(v/0.6*40))}px;opacity:${(0.45+v).toFixed(2)}" title="${n}: ${v}"></div>`;
  }).join("");
  document.getElementById("gtitle").textContent=p.title;
  document.getElementById("gsub").innerHTML=
    `Composite <b class="mono">${s.composite.toFixed(3)}</b> · ${s.level} · `+
    `<b class="mono">${s.on} of 6</b> signals informed it`+
    (s.thin?` — <b>held: cleared on too little</b>`:"");
  document.getElementById("gsig").innerHTML=SIGNALS.map(n=>
    `${n.replace(/_risk$/,"")} ${s.v[n]===null?"—":s.v[n].toFixed(2)}`).join(" · ");
  const pill=document.getElementById("gpill");
  pill.className="tag "+(s.decision==="ALLOW"?"ok":s.decision==="BLOCK"?"gap":"thin");
  pill.textContent=s.decision;
  const go=document.getElementById("gcommit");
  go.disabled = s.decision==="BLOCK";
  go.textContent = s.decision==="REVIEW" ? "Override & commit" : "Commit";
}
const unstage=()=>{staged=null;gate.classList.add("idle")};
document.getElementById("gcancel").onclick=()=>{unstage();toast("Discarded — nothing ran")};
document.getElementById("gcommit").onclick=()=>{const p=staged;if(!p)return;unstage();p.commit()};
let tT; function toast(m){const e=document.getElementById("toast");e.textContent=m;e.hidden=false;
  clearTimeout(tT);tT=setTimeout(()=>e.hidden=true,2600)}

const main=document.getElementById("main"), rail=document.getElementById("rail");
rail.insertAdjacentHTML("beforeend",PROBLEMS.map(p=>
  `<button class="problem" type="button" data-p="${p.id}" aria-current="${p.id===current}">
     <span class="t">${esc(p.t)}</span><span class="d">${esc(p.d)}</span></button>`).join(""));
rail.addEventListener("click",e=>{const b=e.target.closest(".problem");if(!b)return;
  current=b.dataset.p;
  rail.querySelectorAll(".problem").forEach(x=>x.setAttribute("aria-current",String(x.dataset.p===current)));
  render()});
function render(){
  main.innerHTML=({week:weekPane,draft:draftPane,case:casePane,ask:askPane,cost:costPane})[current]();
  wire();
}

/* 01 — cadence ─────────────────────────────────────────────────────── */
function weekPane(){
  const done=state.week.filter(d=>d.state==="published").length;
  const slots=state.week.filter(d=>d.state==="slot").length;
  const drafted=state.week.filter(d=>d.state==="drafted").length;
  return `<section class="pane"><header>
    <h2>Hit this week's cadence</h2>
    <p class="lede">Three LinkedIn and two Instagram a week is the locked cadence. Each slot
    also carries the criterion it feeds, because a week that ships on time and files nothing
    is only half the job.</p></header>
    <div class="grid c3" style="margin-bottom:15px">
      <div class="card"><div class="tile"><span class="v">${done}<span style="color:var(--ink-3);font-size:18px">/5</span></span><span class="k">shipped this week</span></div></div>
      <div class="card"><div class="tile"><span class="v">${drafted}</span><span class="k">drafted, not published</span></div></div>
      <div class="card"><div class="tile"><span class="v">${slots}</span><span class="k">slots still empty</span></div></div>
    </div>
    <div class="week">${state.week.map(d=>{
      if(!d.ch) return `<div class="day" style="background:var(--surface-2);border-style:none">
        <span class="dn">${d.d}</span><span class="none">rest</span></div>`;
      const tagged = d.crit ? `<span class="tag case">criterion ${d.crit}</span>` : "";
      if(d.state==="slot") return `<div class="day slot"><span class="dn">${d.d} · ${d.ch}</span>
        <span class="none">empty slot</span>${tagged}
        <div class="acts" style="margin-top:auto"><button class="act" data-fill="${d.d}">Draft it</button></div></div>`;
      return `<div class="day"><span class="dn">${d.d} · ${d.ch}</span>
        <span class="ti">${esc(d.title)}</span>${tagged}
        <div class="acts" style="margin-top:auto">
          ${d.state==="published"
            ? `<span class="tag ok">published</span>`
            : `<button class="act primary" data-pub="${d.d}">Publish</button>`}
        </div></div>`;
    }).join("")}</div>
    <p class="note" style="margin-top:14px">Publishing is the consequential step, so it is
    proposed at the gate rather than run on click. Drafting spends a model call, so it is too.</p>
  </section>`;
}

/* 02 — draft ───────────────────────────────────────────────────────── */
function draftPane(){
  const d=state.draft;
  return `<section class="pane"><header>
    <h2>Draft with a strategist</h2>
    <p class="lede">Three agents live in <span class="mono">.claude/agents/</span>. Two write;
    one reads the file cold and tells you what is missing. Pick one, give it the topic, and the
    call goes through the gate before it spends anything.</p></header>
    <div class="card">
      <form id="dform">
        <div class="askrow" style="margin-bottom:10px">
          <select id="agent" aria-label="Which strategist">
            ${Object.entries(AGENTS).map(([k,a])=>`<option value="${k}">${a.label}</option>`).join("")}
          </select>
        </div>
        <p class="note" id="blurb" style="margin:0 0 10px">${AGENTS["linkedin-growth-strategist"].blurb}</p>
        <textarea id="topic" aria-label="Topic"
          placeholder="How a stale EngineVersion pin cost us a deploy and a rollback">${d?esc(d.topic):""}</textarea>
        <div class="acts" style="margin-top:10px"><button class="btn go" type="submit" id="dbtn">Draft it</button></div>
      </form>
      ${d?draftCard(d):`<p class="note" style="margin-top:12px">
        Nothing drafted yet. The draft is text until you publish it — that is a separate,
        gated step on the cadence board.</p>`}
    </div></section>`;
}
function draftCard(d){
  return `<div style="margin-top:15px;display:flex;flex-direction:column;gap:12px">
    <div class="acts">
      <span class="tag reach">${esc(d.channel||"no channel")}</span>
      ${d.crit?`<span class="tag case">feeds criterion ${d.crit}</span>`:`<span class="tag mute">advisory — files nothing</span>`}
    </div>
    <div style="white-space:pre-wrap;font-size:15px;line-height:1.6">${esc(d.text)}</div>
    ${d.crit?`<div class="acts"><button class="act primary" id="queue">Queue for the next slot</button></div>`:""}
  </div>`;
}

/* 03 — the case ────────────────────────────────────────────────────── */
function casePane(){
  const met=CRITERIA.filter(c=>(state.evidence[c.n]||0)>=2).length;
  const thin=CRITERIA.filter(c=>(state.evidence[c.n]||0)===1).length;
  const total=Object.values(state.evidence).reduce((a,b)=>a+b,0);
  return `<section class="pane"><header>
    <h2>Build the EB1A case</h2>
    <p class="lede">Three of ten criteria is the floor, not the answer — the file then has to
    survive a final-merits determination as a whole. The ledger below counts documented
    evidence, not intentions.</p></header>
    <div class="grid c3" style="margin-bottom:15px">
      <div class="card"><div class="tile"><span class="v">${met}</span><span class="k">criteria documented — three is the floor</span></div></div>
      <div class="card"><div class="tile"><span class="v">${thin}</span><span class="k">resting on a single document</span></div></div>
      <div class="card"><div class="tile"><span class="v">${daysLeft()}</span><span class="k">days to the 60-day target</span></div></div>
    </div>
    ${thin?`<div class="card" style="border-color:var(--thin);margin-bottom:14px">
      <span class="tag thin">thin</span>
      <p style="margin:9px 0 0;font-size:14.5px">${thin} criteri${thin===1?"on rests":"a rest"} on one
      document. That is the same failure the gate refuses downstairs: a clear on one signal is
      not the evidence a clear on six is, and an adjudicator reading the file cold applies
      exactly that standard.</p></div>`:""}
    <div class="card"><div class="led">${CRITERIA.map(c=>{
      const n=state.evidence[c.n]||0;
      const verdict = n>=2?["ok","documented"]:n===1?["thin","thin"]:["gap","nothing filed"];
      return `<div class="row">
        <span class="k">${String(c.n).padStart(2,"0")}</span>
        <span class="n">${esc(c.name)}<small>${esc(c.full)}</small>
          ${DEMO.notes[c.n]?`<small style="color:var(--ink-2);margin-top:3px">${esc(DEMO.notes[c.n])}</small>`:""}</span>
        <span class="ev" title="${n} documented item${n===1?"":"s"}">
          ${[0,1,2,3].map(i=>`<i class="${i<n?"":"empty"}"></i>`).join("")}${n>4?`<span class="k">+${n-4}</span>`:""}</span>
        <span class="verdict"><span class="tag ${verdict[0]}">${verdict[1]}</span></span>
      </div>`}).join("")}</div>
      <p class="note" style="margin-top:13px">Total documented items: <b class="mono">${total}</b>.
      Criteria 7 and 10 are artistic and performing-arts tests — they are listed because the
      regulation lists them, not because they are routes here.</p>
    </div></section>`;
}

/* 04 — ask ─────────────────────────────────────────────────────────── */
function askPane(){
  const a=state.answer;
  return `<section class="pane"><header>
    <h2>Ask my own corpus</h2>
    <p class="lede">The deploy workflow syncs every <span class="mono">.md</span> in this repo
    to the knowledge layer on each push to main — and only the markdown, because the sync
    filters on it. So this answers from the articles, the resume and the drafts, and from
    nothing else here.</p></header>
    <div class="card">
      <form class="askrow" id="aform">
        <input type="text" id="q" aria-label="Question" placeholder="What of mine is actually in the corpus?" value="${a?esc(a.q):""}">
        <button class="btn go" type="submit" id="abtn">Ask</button>
      </form>
      ${a?ansCard(a):`<p class="note" style="margin-top:12px">Weights differ by source: an
      article carries more than the resume, which is self-reported and not independently
      verified.</p>`}
    </div></section>`;
}
function ansCard(a){
  return `<div style="margin-top:15px;display:flex;flex-direction:column;gap:13px">
    <p style="margin:0;font-size:15.5px;line-height:1.6">${esc(a.answer)}</p>
    <div class="grid c3">
      <div class="tile"><span class="v">${pct(a.confidence)}</span><span class="k">confidence</span></div>
      <div class="tile"><span class="v">${a.confidenceReported?"reported":"fallback"}</span><span class="k">by the model</span></div>
      <div class="tile"><span class="v">${esc(a.strategy.replace(/_/g," "))}</span><span class="k">retrieval strategy</span></div>
    </div>
    ${!a.confidenceReported?`<p class="note"><b>No confidence was reported.</b> The number is a
      constant the code chose, so the router is not updated from it.</p>`:""}
    <div><div class="eyebrow" style="margin-bottom:7px">Sources</div>
      <div style="display:flex;flex-direction:column;gap:9px">${a.sources.map(s=>
        `<div class="src"><span class="f">${esc(s.file)} · weight ${s.weight}</span>
         <span class="x">“${esc(s.excerpt)}”</span></div>`).join("")}</div></div>
  </div>`;
}

/* 05 — cost ────────────────────────────────────────────────────────── */
function costPane(){
  const tot=DEMO.spend.reduce((a,s)=>a+s.usd,0);
  const max=Math.max(...DEMO.spend.map(s=>s.usd));
  const d=DEMO.decisions, dt=d.ALLOW+d.REVIEW+d.BLOCK;
  const imp=DEMO.reach.reduce((a,r)=>a+r.imp,0);
  return `<section class="pane"><header>
    <h2>See what it cost</h2>
    <p class="lede">What the week spent on model calls, what it reached, and what the gate
    declined to wave through.</p></header>
    <div class="grid c3" style="margin-bottom:15px">
      <div class="card"><div class="tile"><span class="v">${usd(tot)}</span><span class="k">model spend, this week</span></div></div>
      <div class="card"><div class="tile"><span class="v">${num(imp)}</span><span class="k">impressions across channels</span></div></div>
      <div class="card"><div class="tile"><span class="v">${usd(tot/(imp/1000))}</span><span class="k">per thousand reached</span></div></div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div class="eyebrow" style="margin-bottom:11px">Reach by channel</div>
      <div class="bars">${DEMO.reach.map(r=>`<div class="bar">
        <span class="lab">${esc(r.ch)}</span>
        <span class="track"><span class="fill" style="width:${(r.imp/imp*100).toFixed(1)}%;background:var(${r.c})"></span></span>
        <span class="val">${num(r.imp)}</span></div>`).join("")}</div>
      <div class="legend">${DEMO.reach.map(r=>
        `<span><i class="sw" style="background:var(${r.c})"></i>${esc(r.ch)} · ${r.n} this week</span>`).join("")}</div>
    </div>
    <div class="grid c2">
      <div class="card">
        <div class="eyebrow" style="margin-bottom:11px">Where the money went</div>
        <div class="bars">${DEMO.spend.map(s=>`<div class="bar" style="grid-template-columns:150px 1fr auto">
          <span class="lab">${esc(s.op)}</span>
          <span class="track"><span class="fill" style="width:${(s.usd/max*100).toFixed(1)}%;background:var(--reach)"></span></span>
          <span class="val">${usd(s.usd)}</span></div>`).join("")}</div>
      </div>
      <div class="card">
        <div class="eyebrow" style="margin-bottom:11px">What the gate did</div>
        <div class="bars">${[["ALLOW",d.ALLOW,"ok"],["REVIEW",d.REVIEW,"thin"],["BLOCK",d.BLOCK,"gap"]].map(([k,v,c])=>
          `<div class="bar" style="grid-template-columns:96px 1fr auto">
            <span class="lab"><span class="tag ${c}">${k}</span></span>
            <span class="track"><span class="fill" style="width:${(v/dt*100).toFixed(1)}%;background:var(--${c})"></span></span>
            <span class="val">${num(v)}</span></div>`).join("")}</div>
        <p class="note" style="margin-top:11px">REVIEW is the gate declining to decide alone,
        not a failure. Those ${d.REVIEW} waited for you.</p>
      </div>
    </div></section>`;
}
</script>
<script>
"use strict";
let sampler=null, tried=false;
async function getSampler(){
  if(tried) return sampler;
  tried=true;
  try{ sampler=(await window.claude?.use?.("sample"))||null }catch{ sampler=null }
  return sampler;
}

function wire(){
  // cadence
  main.querySelectorAll("[data-pub]").forEach(b=>b.onclick=()=>{
    const day=state.week.find(x=>x.d===b.dataset.pub);
    stage({title:`publish to ${day.ch} — “${day.title}”`, score:score("publish",day.title),
      commit(){ day.state="published";
        toast(`Published. Filed against criterion ${day.crit}.`);
        state.evidence[day.crit]=(state.evidence[day.crit]||0)+1; render(); }});
  });
  main.querySelectorAll("[data-fill]").forEach(b=>b.onclick=()=>{
    current="draft"; 
    rail.querySelectorAll(".problem").forEach(x=>x.setAttribute("aria-current",String(x.dataset.p==="draft")));
    render();
  });

  // draft
  const sel=main.querySelector("#agent");
  if(sel) sel.onchange=()=>{ main.querySelector("#blurb").textContent=AGENTS[sel.value].blurb };
  const df=main.querySelector("#dform");
  if(df) df.onsubmit=e=>{
    e.preventDefault();
    const topic=main.querySelector("#topic").value.trim();
    const key=main.querySelector("#agent").value;
    if(!topic) return;
    stage({title:`${AGENTS[key].label} — draft on “${topic.slice(0,48)}${topic.length>48?"…":""}”`,
      score:score("draft",topic),
      async commit(){
        const btn=main.querySelector("#dbtn");
        if(btn){btn.disabled=true;btn.textContent="Drafting…"}
        state.draft=await draftWith(key,topic);
        render();
      }});
  };
  const q=main.querySelector("#queue");
  if(q) q.onclick=()=>{
    const slot=state.week.find(d=>d.state==="slot");
    if(!slot){ toast("No empty slot left this week"); return; }
    slot.title=state.draft.text.split("\n")[0].slice(0,60);
    slot.state="drafted";
    toast(`Queued for ${slot.d}`);
    current="week";
    rail.querySelectorAll(".problem").forEach(x=>x.setAttribute("aria-current",String(x.dataset.p==="week")));
    render();
  };

  // ask
  const af=main.querySelector("#aform");
  if(af) af.onsubmit=async e=>{
    e.preventDefault();
    const text=main.querySelector("#q").value.trim(); if(!text) return;
    const btn=main.querySelector("#abtn"); btn.disabled=true; btn.textContent="Asking…";
    state.answer=await ask(text); render();
  };
}

async function draftWith(key,topic){
  const a=AGENTS[key];
  const s=await getSampler();
  if(!s) return {topic, channel:a.channel, crit:a.crit,
    text:"No drafting model is available in this view, so nothing was generated.\n\nThe agent's own definition lives in .claude/agents/"+key+".md — run it from Claude Code and paste the result here, or deploy this page where it can reach the orchestrator."};
  const briefs={
    "linkedin-growth-strategist":`Write one LinkedIn post, 120-190 words. Structure: a hook line that states a
      specific consequence, then concrete proof with a real number or mechanism, then one
      question to the reader. No hashtags, no emoji, no "thoughts?" filler. Voice: a senior
      engineer who has actually shipped this, writing plainly.`,
    "instagram-growth-strategist":`Write a 45-60 second Instagram Reel script for @microlearn.withme teaching this to a
      curious professional. Give: HOOK (one line, 3 seconds), then 4 beats each with the
      spoken line and what is on screen, then a closing line. Plain language, no jargon left
      undefined.`,
    "eb1a-advisor":`You are reading this file cold, as a USCIS adjudicator would. In 120-160 words, say what
      this accomplishment is actually worth as EB1A evidence, which of the ten regulatory
      criteria it plausibly serves, and what documentation is missing to make it stand up.
      Be candid about weakness; do not flatter.`
  };
  try{
    const out=await s(`${briefs[key]}\n\nTopic: ${topic}`, {modelTier:"default"});
    return {topic, channel:a.channel, crit:a.crit, text:out.text.trim()};
  }catch{
    return {topic, channel:a.channel, crit:a.crit,
      text:"The drafting call failed. That is infrastructure, not the topic — retrying is reasonable."};
  }
}

async function ask(q){
  if(LIVE && CFG.services.contextweave?.api_base){
    try{
      const r=await fetch(CFG.services.contextweave.api_base+"/query-expertise",{
        method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q})});
      if(r.ok){ const d=await r.json(); return {...d,q}; }
    }catch{}
  }
  const s=await getSampler();
  if(!s) return {...DEMO.answer,q};
  try{
    const out=await s.json(
      `You stand in for a retrieval layer over one person's markdown corpus: technical
       articles on AI agent architecture, a resume, LinkedIn drafts, and a repo README.
       Answer in 2-4 sentences. Be honest if the corpus plausibly would not contain it.
       Question: ${q}
       Return JSON: {"answer":string,"sources":[{"file":string,"excerpt":string,"weight":number}],
       "confidence":number,"strategy":"graph_first"|"hybrid"|"keyword_boosted"|"semantic_search"}`,
      {modelTier:"default"});
    return {answer:out.answer, sources:out.sources||[], confidence:out.confidence??.7,
            confidenceReported:true, strategy:out.strategy||"semantic_search", q};
  }catch{ return {...DEMO.answer,q}; }
}

(function boot(){
  const txt=document.getElementById("modetext"), chip=document.getElementById("modechip");
  if(LIVE){ txt.textContent="Live";
    chip.querySelector(".dot").style.background="var(--ok)";
    chip.title="Reading the deployed stacks named in window.WEAVE_CONFIG"; }
  else { chip.title="Figures below are examples, not real. Set window.WEAVE_CONFIG from "+
    "`python e2e/platform_env.py` in mcp-observatory to read the live stacks."; }
  const btn=document.getElementById("themebtn");
  let f=null; try{ f=localStorage.getItem("cc-theme") }catch{}
  if(f) document.documentElement.setAttribute("data-theme",f);
  btn.onclick=()=>{
    const now=document.documentElement.getAttribute("data-theme");
    const next=now==="dark"?"light":now==="light"?null:"dark";
    if(next) document.documentElement.setAttribute("data-theme",next);
    else document.documentElement.removeAttribute("data-theme");
    try{ next?localStorage.setItem("cc-theme",next):localStorage.removeItem("cc-theme") }catch{}
  };
  render();
})();
</script>
